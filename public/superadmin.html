<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="robots" content="noindex, nofollow" /><title>FinPulse AI — Super Admin</title><style> :root { --bg: #0b1220; --panel: #111827; --panel-border: #1f2937; --text: #e5e7eb; --muted: #9ca3af; --accent: #3b5bdb; --accent-hover: #4c6ef5; --danger: #ff5a45; --ok: #22c55e; --warn: #f59e0b; } * { box-sizing: border-box; } body { margin: 0; font-family: -apple-system, "Inter", "Manrope", Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; } header { padding: 20px 28px; border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; } header h1 { font-size: 18px; margin: 0; font-weight: 600; } header .sub { color: var(--muted); font-size: 13px; } main { max-width: 1000px; margin: 0 auto; padding: 24px 28px 60px; } .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 20px; margin-bottom: 20px; } .card h2 { font-size: 15px; margin: 0 0 14px; font-weight: 600; } .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; } input, select { background: #0d1420; border: 1px solid var(--panel-border); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px; } button { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-weight: 500; } button:hover { background: var(--accent-hover); } button.secondary { background: #1f2937; } button.secondary:hover { background: #2a3646; } button.danger { background: var(--danger); } table { width: 100%; border-collapse: collapse; font-size: 13px; } th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--panel-border); } th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; } tr:hover td { background: #0f1725; } .status { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; } .status.trial { background: rgba(245,158,11,0.15); color: var(--warn); } .status.active { background: rgba(34,197,94,0.15); color: var(--ok); } .status.suspended { background: rgba(255,90,69,0.15); color: var(--danger); } .muted { color: var(--muted); } .hidden { display: none !important; } #authGate { max-width: 420px; margin: 80px auto; text-align: center; } #authGate input { width: 100%; margin-bottom: 12px; } #authGate button { width: 100%; } .msg { font-size: 13px; padding: 8px 0; } .msg.error { color: var(--danger); } .msg.ok { color: var(--ok); } .link-btn { background: none; color: var(--accent); padding: 0; text-decoration: underline; font-size: 12px; } .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 50; } .modal { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 22px; width: 480px; max-width: 90vw; max-height: 80vh; overflow: auto; } .modal h3 { margin: 0 0 14px; font-size: 15px; } .log-entry { padding: 8px 0; border-bottom: 1px solid var(--panel-border); font-size: 12px; } .log-entry .at { color: var(--muted); } </style></head><body><div id="authGate" class="card"><h2>FinPulse AI — Super Admin</h2><p class="muted" style="font-size:13px;">Введите секретный ключ панели супер-админа.</p><input id="secretInput" type="password" placeholder="SUPERADMIN_SECRET" autocomplete="off" /><button id="loginBtn">Войти</button><div id="authMsg" class="msg"></div></div><div id="app" class="hidden"><header><div><h1>FinPulse AI — Super Admin</h1><div class="sub">Реестр тенантов платформы</div></div><button class="secondary" id="logoutBtn">Выйти</button></header><main><div class="card"><h2>Новый тенант</h2><div class="row"><input id="newName" placeholder="Название бизнеса" /><input id="newOwnerName" placeholder="Имя владельца (опц.)" /><input id="newOwnerPhone" placeholder="Телефон (опц.)" /><button id="createBtn">Создать</button></div><div id="createMsg" class="msg"></div></div><div class="card"><div class="row" style="justify-content: space-between; margin-bottom: 10px;"><h2 style="margin:0;">Тенанты</h2><button class="secondary" id="refreshBtn">Обновить</button></div><table><thead><tr><th>Название</th><th>Владелец</th><th>Статус</th><th>Создан</th><th></th></tr></thead><tbody id="tenantsBody"><tr><td colspan="5" class="muted">Загрузка…</td></tr></tbody></table></div></main></div><div id="modalRoot"></div><script src="/superadmin.js" defer></script></body></html>
